version: "3.8"
services:
  db:
    image: postgres:13
    restart: always
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: mydb
    ports:
      - "5469:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  chrome:
    image: browserless/chrome:latest
    ports:
      - "3002:3000"
    environment:
      - TOKEN=
      - MAX_CONCURRENT_SESSIONS=10
      - CONNECTION_TIMEOUT=300000
      - MAX_QUEUE_LENGTH=20
      - ENABLE_CORS=true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always

volumes:
  postgres_data:
