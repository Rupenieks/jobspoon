services:
  # Databases
  - type: postgres
    name: redundant-db-staging
    ipAllowList: [] # empty array means allow all
    plan: free
    branch: staging
    envVars:
      - key: POSTGRES_DB
        value: redundant_staging

  # - type: postgres
  #   name: redundant-db-prod
  #   ipAllowList: []
  #   plan: standard
  #   branch: main
  #   envVars:
  #     - key: POSTGRES_DB
  #       value: redundant_prod

  # Staging Services
  - type: web
    name: redundant-api-staging
    env: node
    branch: staging
    buildCommand: pnpm install && pnpm build:common && cd packages/backend && prisma generate && pnpm build
    startCommand: cd packages/backend && pnpm start:prod
    envVars:
      - key: NODE_ENV
        value: staging

  - type: web
    name: redundant-frontend-staging
    env: static
    branch: staging
    buildCommand: pnpm install && cd packages/frontend && pnpm build:staging
    staticPublishPath: packages/frontend/dist
    envVars:
      - key: NODE_ENV
        value: staging

