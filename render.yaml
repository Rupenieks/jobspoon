services:
  - type: web
    name: redundant-api-staging
    env: node
    branch: staging
    buildCommand: pnpm install && pnpm build && cd packages/backend && prisma generate
    startCommand: cd packages/backend && pnpm start:prod
    envVars:
      - key: NODE_ENV
        value: staging

  - type: web
    name: redundant-frontend-staging
    env: static
    branch: staging
    buildCommand: pnpm install && cd packages/frontend && pnpm build
    staticPublishPath: packages/frontend/dist
    envVars:
      - key: NODE_ENV
        value: staging

databases:
  - name: redundant-db-staging
    plan: free
