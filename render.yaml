services:
  - type: web
    name: redundant-api-staging
    env: node
    branch: staging
    rootDir: packages/backend
    buildCommand: >
      pnpm install &&
      pnpm build &&
      cd packages/backend &&
      npx prisma generate &&
      pnpm build
    startCommand: cd packages/backend && pnpm start:prod
    postDeploy: cd packages/backend && npx prisma migrate deploy

  - type: web
    name: redundant-frontend-staging
    env: static
    rootDir: packages/frontend
    branch: staging
    buildCommand: >
      pnpm install &&
      pnpm build &&
      cd packages/frontend &&
      pnpm build
    staticPublishPath: packages/frontend/dist

databases:
  - name: redundant-db-staging
    plan: free
