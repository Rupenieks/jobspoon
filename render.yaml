services:
  # Databases
  - type: pserv
    name: jobspoon-db-staging
    env: docker
    plan: free
    branch: staging
    repo: https://github.com/render-examples/postgres-docker
    envVars:
      - key: POSTGRES_DB
        value: jobspoon_staging

  # - type: pserv
  #   name: jobspoon-db-prod
  #   env: docker
  #   plan: standard
  #   branch: main
  #   repo: https://github.com/render-examples/postgres-docker
  #   envVars:
  #     - key: POSTGRES_DB
  #       value: jobspoon_prod

  # Staging Services
  - type: web
    name: jobspoon-api-staging
    env: node
    branch: staging
    buildCommand: pnpm install && pnpm build:common && cd packages/backend && prisma generate && pnpm build
    startCommand: cd packages/backend && pnpm start:prod
    envVars:
      - key: NODE_ENV
        value: staging

  - type: web
    name: jobspoon-frontend-staging
    env: static
    branch: staging
    buildCommand: pnpm install && cd packages/frontend && pnpm build:staging
    staticPublishPath: packages/frontend/dist
    envVars:
      - key: NODE_ENV
        value: staging

