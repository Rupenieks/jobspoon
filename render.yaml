services:
  - type: postgres
    name: redundant-db-staging
    ipAllowList: []
    plan: free

  - type: web
    name: redundant-api-staging
    env: node
    branch: staging
    buildCommand: >
      pnpm install &&
      pnpm build:common &&
      cd packages/backend &&
      npx prisma generate &&
      pnpm build
    startCommand: cd packages/backend && pnpm start:prod
    envVars:
      - key: NODE_ENV
        value: staging

  - type: web
    name: redundant-frontend-staging
    env: static
    branch: staging
    buildCommand: >
      pnpm install &&
      pnpm build:common &&
      cd packages/frontend &&
      pnpm build:staging
    staticPublishPath: packages/frontend/dist
