services:
  - type: web
    name: redundant-api
    env: node
    buildCommand: pnpm install && pnpm build
    startCommand: pnpm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: redundant-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: CHROME_URL
        value: your-browserless-url
      - key: CHROME_TOKEN
        value: your-browserless-token

  - type: web
    name: redundant-frontend
    env: static
    buildCommand: pnpm install && cd packages/frontend && pnpm build
    staticPublishPath: packages/frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://redundant-api.onrender.com
