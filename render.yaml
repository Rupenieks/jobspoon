services:
  - type: web
    name: redundant-api-staging
    env: node
    branch: staging
    buildCommand: >
      pnpm install --no-frozen-lockfile &&
      pnpm build &&
      cd packages/backend &&
      npx prisma migrate deploy &&
      npx prisma generate &&
      pnpm build
    startCommand: cd packages/backend && pnpm start:prod

  - type: web
    name: redundant-frontend-staging
    env: static
    branch: staging
    buildCommand: >
      pnpm install --no-frozen-lockfile &&
      pnpm build &&
      cd packages/frontend &&
      pnpm build
    staticPublishPath: packages/frontend/dist

  - type: web
    name: redundant-preview-staging
    env: static
    branch: staging
    buildCommand: >
      pnpm install --no-frozen-lockfile &&
      cd packages/frontend &&
      pnpm build:preview
    staticPublishPath: packages/frontend/dist/resume-viewer

databases:
  - name: redundant-db-staging
    plan: free
