services:
  - type: web
    name: redundant-api-staging
    env: node
    branch: staging
    rootDir: packages/backend
    buildCommand: >
      pnpm install --no-frozen-lockfile &&
      pnpm build:common &&
      cd packages/backend &&
      npx prisma migrate deploy &&
      npx prisma generate && pnpm build
    startCommand: cd packages/backend && pnpm start:prod

  - type: web
    name: redundant-frontend-staging
    env: static
    rootDir: packages/frontend
    branch: staging
    buildCommand: >
      pnpm install --no-frozen-lockfile &&
      pnpm build:common &&
      cd packages/frontend &&
      pnpm build:staging
    staticPublishPath: packages/frontend/dist

databases:
  - name: redundant-db-staging
    plan: free
